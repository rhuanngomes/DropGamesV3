<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — DropGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="dg-login-page">

  <!-- ==================== LEFT: FORM ==================== -->
  <div class="dg-login-left">

    <!-- Logo -->
    <a href="index.html" class="dg-login-logo">
      <img src="img/logo-dropgames.svg" alt="DropGames" />
    </a>

    <!-- Form centered -->
    <div class="dg-login-form-wrap">
      <form class="dg-login-form" action="#" novalidate>

        <!-- Heading -->
        <div class="dg-login-heading-block">
          <p class="dg-login-title">Bem-vindo de volta!</p>
          <p class="dg-login-subtitle">Bem-vindo de volta! Por favor, insira seus dados.</p>
        </div>

        <!-- Email -->
        <div class="dg-login-field">
          <label class="dg-login-label" for="login-email">Email</label>
          <div class="dg-login-input-wrap">
            <input id="login-email" type="email" class="dg-login-input" placeholder="Seu email" />
          </div>
        </div>

        <!-- Password -->
        <div class="dg-login-field">
          <label class="dg-login-label" for="login-password">Password</label>
          <div class="dg-login-input-wrap">
            <input id="login-password" type="password" class="dg-login-input" placeholder="*********" />
            <img src="img/login-eye.svg" alt="Mostrar senha" class="dg-login-eye" id="toggle-password" />
          </div>
        </div>

        <!-- Remember / Forgot -->
        <div class="dg-login-remember-row">
          <label class="dg-login-remember">
            <input type="checkbox" class="dg-login-checkbox" />
            <span class="dg-login-remember-label">Lembrar por 30 dias</span>
          </label>
          <a href="#" class="dg-login-forgot">Forgot password</a>
        </div>

        <!-- Entrar -->
        <button type="submit" class="dg-login-btn-primary">Entrar</button>

        <!-- Google -->
        <button type="button" class="dg-login-btn-google">
          <img src="img/login-google-icon.png" alt="Google" class="dg-login-google-icon" />
          Sign in with Google
        </button>

        <!-- Sign up -->
        <div class="dg-login-signup-row">
          <span>Don`t have an account?</span>
          <a href="signup.html">Sign up</a>
        </div>

      </form>
    </div>

    <!-- Copyright -->
    <p class="dg-login-copyright">Drop Games. All rights reserved. 2026</p>

  </div>

  <!-- ==================== RIGHT: VIDEO ==================== -->
  <div class="dg-login-right">
    <video
      class="dg-login-video"
      src="img/login-video.mp4"
      autoplay
      loop
      playsinline
    ></video>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
