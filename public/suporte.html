<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte — DropGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/suporte.css" />
  <script src="js/auth.js" defer></script>
</head>
<body class="dg-suporte-page">

  <!-- ==================== HEADER ==================== -->
  <header class="dg-header">
    <div class="dg-header-inner">
      <a href="index.html" class="dg-logo">
        <img src="img/logo-dropgames.svg" alt="DropGames" class="dg-logo-img" />
      </a>

      <nav class="dg-nav">
        <a href="index.html" class="dg-nav-link">Descobrir <img src="img/icon-chevron.svg" class="dg-nav-chevron" alt="" /></a>
        <a href="sobre-nos.html" class="dg-nav-link">Sobre nós <img src="img/icon-chevron.svg" class="dg-nav-chevron" alt="" /></a>
        <a href="dados.html" class="dg-nav-link">Dados</a>
        <a href="suporte.html" class="dg-nav-link dg-nav-link--active">Suporte</a>
      </nav>

      <div class="dg-header-actions">
        <button class="dg-btn dg-btn-ghost">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <a href="login.html" class="dg-btn dg-btn-secondary dg-auth-only">Entrar</a>
        <a href="signup.html" class="dg-btn dg-btn-primary dg-auth-only">Cadastrar</a>
        <div class="dg-header-notif dg-logged-only">
          <img src="img/header-bell.svg" alt="" class="dg-notif-icon" />
          <span class="dg-notif-badge">2</span>
        </div>
        <div class="dg-header-avatar dg-logged-only">
          <img src="img/header-avatar.jpg" alt="Perfil" />
        </div>
      </div>
    </div>
  </header>

  <main>

    <!-- ==================== CONTACT SECTION ==================== -->
    <section class="dg-contact-section">
      <div class="dg-contact-inner">

        <!-- Left: form -->
        <div class="dg-contact-form-col">
          <div class="dg-contact-heading-block">
            <h1 class="dg-contact-heading">Entre em contato</h1>
            <p class="dg-contact-sub">Nossa equipe atenciosa adoraria ouvir de você.</p>
          </div>

          <div class="dg-contact-form-body">
            <div class="dg-contact-fields">
              <!-- First name + Last name -->
              <div class="dg-contact-row">
                <div class="dg-contact-field dg-contact-field--half">
                  <label class="dg-contact-label" for="primeiro-nome">Primeiro nome <span>*</span></label>
                  <input id="primeiro-nome" type="text" class="dg-contact-input" placeholder="Primeiro nome" />
                </div>
                <div class="dg-contact-field dg-contact-field--half">
                  <label class="dg-contact-label" for="ultimo-nome">Último nome <span>*</span></label>
                  <input id="ultimo-nome" type="text" class="dg-contact-input" placeholder="Ultimo nome" />
                </div>
              </div>

              <!-- Email -->
              <div class="dg-contact-field">
                <label class="dg-contact-label" for="email">Email <span>*</span></label>
                <input id="email" type="email" class="dg-contact-input" placeholder="you@gmail.com" />
              </div>

              <!-- Phone -->
              <div class="dg-contact-field">
                <label class="dg-contact-label" for="telefone">Telefone <span>*</span></label>
                <input id="telefone" type="tel" class="dg-contact-input" placeholder="+55 (21) 98834-8765" />
              </div>

              <!-- Checkbox -->
              <div class="dg-contact-checkbox-wrap">
                <input type="checkbox" id="privacidade" class="dg-contact-checkbox" />
                <label for="privacidade" class="dg-contact-checkbox-label">Você concorda com nossa política de privacidade amigável.</label>
              </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="dg-contact-submit" onclick="window.location.href='contato-enviado.html'; return false;">Enviar</button>
          </div>
        </div>

        <!-- Right: image -->
        <img src="img/contact-hero.jpg" alt="" class="dg-contact-img" />

      </div>
    </section>

  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="dg-footer">
    <div class="dg-footer-inner">
      <a href="index.html" class="dg-logo">
        <img src="img/logo-dropgames-footer.svg" alt="DropGames" class="dg-logo-img" />
      </a>
      <nav class="dg-footer-nav">
        <a href="index.html">Descobrir</a>
        <a href="sobre-nos.html">Sobre nós</a>
        <a href="dados.html">Dados</a>
        <a href="suporte.html">Suporte</a>
        <a href="#">Help</a>
        <a href="#">Privacy</a>
      </nav>
    </div>
    <div class="dg-footer-bottom">
      <span>Drop Games. All rights reserved</span>
      <nav class="dg-footer-legal">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Cookies</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
